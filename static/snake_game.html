<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>🐍 炒股贪吃蛇</title>
<script>
// 读取调用方传递的用户名
var urlParams = new URLSearchParams(window.location.search);
var gameUsername = urlParams.get('username') || 'anonymous';
</script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #0d1117; color: #c9d1d9; font-family: 'Microsoft YaHei', sans-serif;
        display: flex; justify-content: center; align-items: flex-start;
        min-height: 100vh; padding: 20px;
    }
    .game-wrapper { display: flex; gap: 24px; align-items: flex-start; position: relative; }
    .game-panel {
        background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px;
    }
    .game-panel h2 { font-size: 1.2rem; margin-bottom: 12px; color: #58a6ff; text-align: center; }
    canvas#snakeCanvas { display: block; border: 1px solid #30363d; border-radius: 4px; }
    .side-panel { display: flex; flex-direction: column; gap: 16px; width: 300px; }
    .stock-card {
        background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px;
    }
    .stock-card h3 { font-size: 1rem; color: #58a6ff; margin-bottom: 8px; }
    .stock-price { font-size: 2.2rem; font-weight: bold; margin: 8px 0; }
    .stock-price.up { color: #3fb950; }
    .stock-price.down { color: #f85149; }
    canvas#chartCanvas { display: block; width: 100%; border: 1px solid #30363d; border-radius: 4px; }
    .info-row {
        display: flex; justify-content: space-between; font-size: 0.85rem;
        color: #8b949e; margin: 4px 0;
    }
    .legend { font-size: 0.8rem; color: #8b949e; margin-top: 8px; }
    .legend span { margin-right: 12px; }
    .game-over-overlay {
        display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.75); justify-content: center; align-items: center;
        border-radius: 12px; z-index: 10;
    }
    .game-over-overlay.show { display: flex; }
    .game-over-box {
        background: #161b22; border: 1px solid #f85149; border-radius: 12px;
        padding: 30px; text-align: center;
    }
    .game-over-box h2 { color: #f85149; margin-bottom: 12px; }
    .game-over-box .final-price { font-size: 2rem; color: #f0c040; margin: 8px 0; }
    .btn {
        margin-top: 16px; padding: 10px 32px; border: none; border-radius: 8px;
        font-size: 1rem; cursor: pointer; font-weight: bold;
        background: #238636; color: #fff; transition: background 0.2s;
    }
    .btn:hover { background: #2ea043; }
    .btn.quit { background: #30363d; margin-left: 8px; }
    .btn.quit:hover { background: #484f58; }
    .done-message {
        display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.75); justify-content: center; align-items: center;
        border-radius: 12px; z-index: 10;
    }
    .done-message.show { display: flex; }
    .done-box {
        background: #161b22; border: 1px solid #3fb950; border-radius: 12px;
        padding: 30px; text-align: center;
    }
    .done-box h2 { color: #3fb950; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="game-wrapper" id="gameWrapper">
    <div class="game-panel">
        <h2>🐍 炒股贪吃蛇</h2>
        <canvas id="snakeCanvas" width="420" height="420"></canvas>
        <div class="info-row" style="margin-top:10px;">
            <span>📏 长度: <b id="snakeLen">3</b></span>
            <span>⏱ 步数: <b id="stepCount">0</b></span>
            <span>🎯 目标: 存活越久股价越高</span>
        </div>
    </div>

    <div class="side-panel">
        <div class="stock-card">
            <h3>📈 模拟股价走势</h3>
            <div class="stock-price" id="priceDisplay">¥100.00</div>
            <div style="font-size:0.85rem; color:#8b949e;">
                涨跌幅: <span id="pctDisplay" style="color:#8b949e;">0.00%</span>
            </div>
            <canvas id="chartCanvas" width="280" height="180"></canvas>
            <div class="legend">
                <span>💰 金币 +5%</span><span>💣 炸弹 -10%</span>
            </div>
        </div>

        <div class="stock-card">
            <h3>🎮 操作说明</h3>
            <p style="font-size:0.85rem;color:#8b949e;line-height:1.8;">
                ⬆⬇⬅➡ 方向键操控<br>
                💰 吃到金币 → 股价 +5%<br>
                💣 碰到炸弹 → 股价 -10%<br>
                撞墙或撞到自己 → 游戏结束
            </p>
        </div>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-box">
            <h2>💀 游戏结束</h2>
            <p style="color:#8b949e;">最终股价</p>
            <div class="final-price" id="finalPrice">¥100.00</div>
            <p style="color:#8b949e;font-size:0.85rem;" id="resultMsg"></p>
            <button class="btn" onclick="submitResult(true)">📊 提交成绩并重新开始</button>
            <button class="btn quit" onclick="submitResult(false)">🚪 提交成绩并返回</button>
        </div>
    </div>

    <div class="done-message" id="doneOverlay">
        <div class="done-box">
            <h2>✅ 成绩已保存</h2>
            <p style="color:#8b949e;">排行榜已更新，可关闭此页面</p>
            <button class="btn" onclick="window.close()">关闭</button>
        </div>
    </div>
</div>

<script>
// State
const GRID = 15, CELL = 28;
const canvas = document.getElementById('snakeCanvas');
const ctx = canvas.getContext('2d');
const chartCanvas = document.getElementById('chartCanvas');
const chartCtx = chartCanvas.getContext('2d');

let snake = [{x: 7, y: 7}, {x: 6, y: 7}, {x: 5, y: 7}];
let direction = {x: 1, y: 0};
let directionQueue = [];
let coin = null, bomb = null;
let stockPrice = 100.0;
let priceHistory = [100.0];
let chartDirty = true;
let gameRunning = true;
let gameOver = false;
let stepCount = 0;
let priceFlash = 0;
let resultSent = false;

function spawnCoin() {
    let pos;
    do {
        pos = {x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID)};
    } while (snake.some(s => s.x === pos.x && s.y === pos.y) || (bomb && bomb.x === pos.x && bomb.y === pos.y));
    coin = pos;
}

function spawnBomb() {
    if (stepCount < 10) return;
    if (Math.random() > 0.15) return;
    let pos;
    for (let tries = 0; tries < 50; tries++) {
        pos = {x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID)};
        if (!snake.some(s => s.x === pos.x && s.y === pos.y) &&
            !(coin && coin.x === pos.x && coin.y === pos.y) &&
            !(bomb && bomb.x === pos.x && bomb.y === pos.y)) {
            bomb = pos;
            return;
        }
    }
}

function spawnFoods() {
    if (!coin) spawnCoin();
    spawnBomb();
}

function step() {
    if (!gameRunning || gameOver) return;
    if (directionQueue.length > 0) direction = directionQueue.shift();
    const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) { endGame(); return; }
    if (snake.some(s => s.x === head.x && s.y === head.y)) { endGame(); return; }

    snake.unshift(head);
    stepCount++;

    if (coin && head.x === coin.x && head.y === coin.y) {
        coin = null; stockPrice *= 1.05; priceFlash = 1; chartDirty = true;
    } else if (bomb && head.x === bomb.x && head.y === bomb.y) {
        bomb = null; stockPrice *= 0.90; priceFlash = -1; chartDirty = true;
        if (snake.length > 2) snake.pop();
    } else {
        snake.pop(); priceFlash = 0;
    }

    priceHistory.push(stockPrice);
    if (priceHistory.length > 200) priceHistory.shift();

    spawnFoods();
    updateUI();
    document.getElementById('snakeLen').textContent = snake.length;
    document.getElementById('stepCount').textContent = stepCount;
}

function endGame() {
    gameRunning = false; gameOver = true;
    document.getElementById('finalPrice').textContent = '¥' + stockPrice.toFixed(2);
    const pct = ((stockPrice - 100) / 100 * 100).toFixed(2);
    document.getElementById('resultMsg').textContent =
        stockPrice >= 100 ? '📈 收益率: +' + pct + '%' : '📉 收益率: ' + pct + '%';
    document.getElementById('gameOverOverlay').classList.add('show');
}

function submitResult(restart) {
    if (resultSent) return;
    resultSent = true;
    if (window.opener && !window.opener.closed) {
        var params = '?game_type=snake&score=' + stockPrice.toFixed(2) + '&username=' + encodeURIComponent(gameUsername);
        if (restart) params += '&restart=1';
        window.opener.location.search = params;
    }
    if (restart) {
        setTimeout(function() { window.location.reload(); }, 400);
    } else {
        document.getElementById('gameOverOverlay').classList.remove('show');
        document.getElementById('doneOverlay').classList.add('show');
    }
}

function draw() {
    ctx.clearRect(0, 0, 420, 420);
    ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, 420, 420);
    ctx.strokeStyle = '#21262d'; ctx.lineWidth = 0.5;
    for (let i = 0; i <= GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, GRID * CELL); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(GRID * CELL, i * CELL); ctx.stroke();
    }
    if (coin) {
        const cx = coin.x * CELL + CELL / 2, cy = coin.y * CELL + CELL / 2;
        ctx.fillStyle = '#f0c040'; ctx.beginPath();
        ctx.arc(cx, cy, CELL / 2 - 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('💰', cx, cy);
    }
    if (bomb) {
        const bx = bomb.x * CELL + CELL / 2, by = bomb.y * CELL + CELL / 2;
        ctx.fillStyle = '#1a1a1a'; ctx.beginPath();
        ctx.arc(bx, by, CELL / 2 - 3, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#f85149'; ctx.lineWidth = 2; ctx.stroke();
        ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.textBaseline = 'middle'; ctx.fillStyle = '#f85149'; ctx.fillText('💣', bx, by);
    }
    snake.forEach((s, i) => {
        const pad = 1;
        if (i === 0) ctx.fillStyle = '#3fb950';
        else { const r = i / snake.length; ctx.fillStyle = 'rgb(30, ' + Math.floor(150 + 105 * (1 - r)) + ', 50)'; }
        ctx.fillRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
        if (i === 0) {
            ctx.fillStyle = '#fff';
            const ex = s.x * CELL + CELL / 2, ey = s.y * CELL + CELL / 2;
            ctx.beginPath(); ctx.arc(ex + direction.x * 5 - 5, ey + direction.y * 5 - 5, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(ex + direction.x * 5 + 5, ey + direction.y * 5 - 5, 2.5, 0, Math.PI * 2); ctx.fill();
        }
    });
    if (gameOver) {
        ctx.fillStyle = 'rgba(255,0,0,0.5)'; ctx.font = 'bold 36px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('游戏结束', 210, 210);
    }
    drawChart();
}

function drawChart() {
    if (!chartDirty) return;
    chartDirty = false;
    const w = 280, h = 180, pad = {top: 15, right: 10, bottom: 25, left: 45};
    const pw = w - pad.left - pad.right, ph = h - pad.top - pad.bottom;
    chartCtx.clearRect(0, 0, w, h);
    chartCtx.fillStyle = '#0d1117'; chartCtx.fillRect(0, 0, w, h);
    if (priceHistory.length < 2) {
        chartCtx.fillStyle = '#8b949e'; chartCtx.font = '12px "Microsoft YaHei", sans-serif';
        chartCtx.textAlign = 'center'; chartCtx.fillText('等待数据...', w / 2, h / 2); return;
    }
    const prices = priceHistory;
    let minP = Math.min(...prices) * 0.95, maxP = Math.max(...prices) * 1.05;
    if (maxP - minP < 10) { const mid = (maxP + minP) / 2; minP = mid - 5; maxP = mid + 5; }
    const scaleX = (i) => pad.left + (i / (prices.length - 1)) * pw;
    const scaleY = (p) => pad.top + ph - ((p - minP) / (maxP - minP)) * ph;
    chartCtx.strokeStyle = '#21262d'; chartCtx.lineWidth = 0.5;
    for (let i = 0; i < 5; i++) {
        const y = pad.top + (ph / 4) * i;
        chartCtx.beginPath(); chartCtx.moveTo(pad.left, y); chartCtx.lineTo(w - pad.right, y); chartCtx.stroke();
    }
    chartCtx.fillStyle = '#8b949e'; chartCtx.font = '10px sans-serif'; chartCtx.textAlign = 'right';
    for (let i = 0; i < 5; i++) {
        chartCtx.fillText('¥' + (maxP - ((maxP - minP) / 4) * i).toFixed(0), pad.left - 5, pad.top + (ph / 4) * i + 3);
    }
    chartCtx.strokeStyle = 'rgba(139, 148, 158, 0.4)'; chartCtx.setLineDash([4, 4]);
    chartCtx.beginPath();
    const baseY = scaleY(100);
    chartCtx.moveTo(pad.left, baseY); chartCtx.lineTo(w - pad.right, baseY); chartCtx.stroke();
    chartCtx.setLineDash([]);
    const isUp = prices[prices.length - 1] >= prices[0];
    const gradient = chartCtx.createLinearGradient(0, pad.top, 0, pad.top + ph);
    gradient.addColorStop(0, isUp ? 'rgba(63, 185, 80, 0.3)' : 'rgba(248, 81, 73, 0.3)');
    gradient.addColorStop(1, isUp ? 'rgba(63, 185, 80, 0.0)' : 'rgba(248, 81, 73, 0.0)');
    chartCtx.beginPath(); chartCtx.moveTo(scaleX(0), pad.top + ph);
    for (let i = 0; i < prices.length; i++) chartCtx.lineTo(scaleX(i), scaleY(prices[i]));
    chartCtx.lineTo(scaleX(prices.length - 1), pad.top + ph); chartCtx.closePath();
    chartCtx.fillStyle = gradient; chartCtx.fill();
    chartCtx.strokeStyle = isUp ? '#3fb950' : '#f85149'; chartCtx.lineWidth = 2;
    chartCtx.beginPath();
    for (let i = 0; i < prices.length; i++)
        i === 0 ? chartCtx.moveTo(scaleX(i), scaleY(prices[i])) : chartCtx.lineTo(scaleX(i), scaleY(prices[i]));
    chartCtx.stroke();
    const lx = scaleX(prices.length - 1), ly = scaleY(prices[prices.length - 1]);
    chartCtx.fillStyle = isUp ? '#3fb950' : '#f85149';
    chartCtx.beginPath(); chartCtx.arc(lx, ly, 4, 0, Math.PI * 2); chartCtx.fill();
}

function updateUI() {
    const d = document.getElementById('priceDisplay');
    d.textContent = '¥' + stockPrice.toFixed(2);
    d.className = 'stock-price' + (priceFlash > 0 ? ' up' : priceFlash < 0 ? ' down' : '');
    const pct = ((stockPrice - 100) / 100 * 100).toFixed(2);
    const pe = document.getElementById('pctDisplay');
    pe.textContent = (pct >= 0 ? '+' : '') + pct + '%';
    pe.style.color = pct >= 0 ? '#3fb950' : '#f85149';
}

document.addEventListener('keydown', function(e) {
    if (!gameRunning) return;
    const lastDir = directionQueue.length > 0 ? directionQueue[directionQueue.length - 1] : direction;
    let newDir = null;
    switch(e.key) {
        case 'ArrowUp': case 'w': case 'W': if (lastDir.y !== 1) newDir = {x: 0, y: -1}; e.preventDefault(); break;
        case 'ArrowDown': case 's': case 'S': if (lastDir.y !== -1) newDir = {x: 0, y: 1}; e.preventDefault(); break;
        case 'ArrowLeft': case 'a': case 'A': if (lastDir.x !== 1) newDir = {x: -1, y: 0}; e.preventDefault(); break;
        case 'ArrowRight': case 'd': case 'D': if (lastDir.x !== -1) newDir = {x: 1, y: 0}; e.preventDefault(); break;
    }
    if (newDir && directionQueue.length < 3) {
        const same = directionQueue.length > 0 &&
            directionQueue[directionQueue.length - 1].x === newDir.x &&
            directionQueue[directionQueue.length - 1].y === newDir.y;
        if (!same) directionQueue.push(newDir);
    }
});

window.addEventListener('beforeunload', function() {
    if (gameRunning && !resultSent && stepCount > 0) submitResult(false);
});

spawnCoin(); updateUI();
// 主循环：180ms 步进 + requestAnimationFrame 渲染
setInterval(step, 180);
var renderRAF;
function renderLoop() {
    draw();
    renderRAF = requestAnimationFrame(renderLoop);
}
renderRAF = requestAnimationFrame(renderLoop);
</script>
</body>
</html>
